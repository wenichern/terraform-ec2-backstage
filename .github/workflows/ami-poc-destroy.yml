name: ami-poc-destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to tear down the AMI PoC (ec2-demo + detect-platform)'
        required: true

permissions:
  id-token: write   # OIDC to AWS
  contents: read

concurrency:
  group: ami-poc     # same group as ami-poc.yml: never destroy while a deploy is running
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "destroy" ]; then
            echo 'You must type "destroy" (all lowercase) to proceed.'
            exit 1
          fi

  destroy-ec2-demo:
    needs: guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ami-poc-demo/terraform/ec2-demo
    steps:
      - uses: actions/checkout@v4
      - name: AWS credentials (OIDC role, if AWS_ROLE_ARN variable is set)
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: AWS credentials (access-key secrets, otherwise)
        if: ${{ vars.AWS_ROLE_ARN == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=ec2-demo.tfstate"
          -backend-config="region=${{ env.AWS_REGION }}"
      # alarm_topic_arn must match whatever value was used on apply, or Terraform sees
      # a diff and tries to update the alarm before destroying it. Reading it from the
      # OTHER stack's remote state keeps this correct without hardcoding the ARN here.
      - name: Read topic ARN from detect-platform's state
        id: topic
        env:
          BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          ARN=$(aws s3api get-object --bucket "$BUCKET" --key detect-platform.tfstate /tmp/dp.tfstate >/dev/null 2>&1 \
            && python3 -c "import json;print(json.load(open('/tmp/dp.tfstate'))['outputs'].get('sns_topic_arn',{}).get('value',''))" \
            || true)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
      - name: Destroy
        run: terraform destroy -auto-approve -input=false -var "alarm_topic_arn=${{ steps.topic.outputs.arn }}"

  destroy-detect-platform:
    needs: destroy-ec2-demo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ami-poc-demo/terraform/detect-platform
    steps:
      - uses: actions/checkout@v4
      - name: AWS credentials (OIDC role, if AWS_ROLE_ARN variable is set)
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: AWS credentials (access-key secrets, otherwise)
        if: ${{ vars.AWS_ROLE_ARN == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=detect-platform.tfstate"
          -backend-config="region=${{ env.AWS_REGION }}"
      - name: Destroy
        run: terraform destroy -auto-approve -input=false -var "alert_email=${{ vars.ALERT_EMAIL }}"

  # NOTE: this does not delete the S3 state bucket or the GitHub OIDC role/IAM role
  # created by terraform/bootstrap. Those are cheap to leave (S3: pennies; IAM: free)
  # and bootstrap was applied locally, not through this workflow. Destroy it by hand
  # from ami-poc-demo/terraform/bootstrap if you want the bucket gone too.
