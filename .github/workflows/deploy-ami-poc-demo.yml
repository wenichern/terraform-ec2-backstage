name: Terraform AMI PoC Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'ami-poc-demo/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'ami-poc-demo/**'
  workflow_dispatch:
    inputs:
      ami_id:
        description: 'AMI ID to deploy (golden path fix)'
        required: true
        type: string

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

defaults:
  run:
    working-directory: ./ami-poc-demo

jobs:
  terraform:
    name: Terraform Plan/Apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.0"

      - name: Terraform Init
        run: terraform init -reconfigure

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan -input=false \
            -var="alarm_topic_arn=${{ secrets.ALARM_TOPIC_ARN }}" \
            ${{ github.event.inputs.ami_id != '' && format('-var=ami_id={0}', github.event.inputs.ami_id) || '' }}

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          terraform apply -auto-approve -input=false \
            -var="alarm_topic_arn=${{ secrets.ALARM_TOPIC_ARN }}" \
            ${{ github.event.inputs.ami_id != '' && format('-var=ami_id={0}', github.event.inputs.ami_id) || '' }}
